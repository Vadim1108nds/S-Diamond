<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Редагування товару</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_home.css') }}">
</head>
<body>
<div class="container">
    <h1>Редагування товару</h1>
    <form action="{{ url_for('edit_product', product_id=product._id) }}" method="POST" enctype="multipart/form-data" class="product-form">
        <input type="text" name="name" value="{{ product.name }}" required>
        <select name="type">
            <option value="ring" {% if product.type == 'ring' %}selected{% endif %}>Кільце</option>
            <option value="earrings" {% if product.type == 'earrings' %}selected{% endif %}>Сережки</option>
            <option value="bracelet" {% if product.type == 'bracelet' %}selected{% endif %}>Браслет</option>
            <option value="pendant" {% if product.type == 'pendant' %}selected{% endif %}>Підвіска</option>
        </select>
        <select name="material">
            <option value="gold" {% if product.material == 'gold' %}selected{% endif %}>Золото</option>
            <option value="silver" {% if product.material == 'silver' %}selected{% endif %}>Срібло</option>
            <option value="platinum" {% if product.material == 'platinum' %}selected{% endif %}>Платина</option>
        </select>
        <select name="stone">
            <option value="diamond" {% if product.stone and 'diamond' in product.stone %}selected{% endif %}>Діамант</option>
            <option value="ruby" {% if product.stone and 'ruby' in product.stone %}selected{% endif %}>Рубін</option>
            <option value="sapphire" {% if product.stone and 'sapphire' in product.stone %}selected{% endif %}>Сапфір</option>
            <option value="amethyst" {% if product.stone and 'amethyst' in product.stone %}selected{% endif %}>Аметист</option>
        </select>
        <input type="number" name="price" value="{{ product.price }}" required>
        <input type="number" step="0.1" name="weight" value="{{ product.weight }}">
        <textarea name="description">{{ product.description }}</textarea>
        <p>📷 Поточне зображення: {{ product.image }}</p>
        <input type="file" name="image">
        <button type="submit" class="add-btn">💾 Зберегти зміни</button>
        <a href="{{ url_for('admin_home') }}" class="button" style="text-align:center;">↩ Скасувати</a>
    </form>
</div>
</body>
</html>
