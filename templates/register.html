<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
</head>
<body>

<div class="page">

    <div class="card">

        <!-- LOGO -->
        <div class="logo-wrap">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Sdiamond" class="logo">
        </div>

        <h1>Вас вітає ювелірна<br>майстерня Sdiamond</h1>

        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>

            <button type="submit" class="btn-main">Зареєструватися</button>
        </form>

        <a href="{{ url_for('login') }}" class="btn-secondary">Вхід</a>

    </div>

</div>

</body>
</html>
