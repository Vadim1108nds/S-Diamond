<!DOCTYPE html>
<html>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/liqpay.css') }}">

<head>
    <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo" alt="S Diamond">
    <title>Перенаправлення на оплату...</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            background: #CBE3F5;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #0E1A4D;
            border-top-color: #FFD966;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <h3>Перенаправлення на сторінку оплати...</h3>
        <p>Будь ласка, зачекайте</p>
    </div>
    <form method="POST" action="{{ liqpay_url }}" id="liqpayForm">
        <input type="hidden" name="data" value="{{ data }}">
        <input type="hidden" name="signature" value="{{ signature }}">
    </form>
    <script>
        document.getElementById('liqpayForm').submit();
    </script>
</body>
</html>
